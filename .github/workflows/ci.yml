# VendorTrack CI/CD Pipeline
# Security-first: Fails deployment if secrets are leaked or missing.
#
# Jobs:
# 1. secret-scan — Gitleaks + TruffleHog scan for leaked credentials
# 2. build-and-test — TypeScript check, ESLint, build verification
# 3. deploy — Only runs if all checks pass (configurable per environment)

name: VendorTrack CI/CD

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # JOB 1: Secret Scanning
  # ============================================================
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning

      - name: Gitleaks — Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: TruffleHog — Scan for secrets in git history
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ============================================================
  # JOB 2: Build & Quality Checks
  # ============================================================
  build-and-test:
    name: 🏗️ Build & Quality
    runs-on: ubuntu-latest
    needs: secret-scan  # Only run if secret scan passes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx next lint

      - name: Build application
        run: npm run build
        env:
          # Required for build — use GitHub Secrets, NOT real values
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify no server secrets in client bundle
        run: |
          echo "Checking for leaked secrets in client bundle..."
          if [ -d ".next/static" ]; then
            # Search for service-role keys, Stripe secrets, etc. in client JS
            if grep -rl "SUPABASE_SERVICE_ROLE_KEY\|STRIPE_SECRET_KEY\|whsec_" .next/static/ 2>/dev/null; then
              echo "❌ SECURITY VIOLATION: Server-only secrets found in client bundle!"
              exit 1
            fi
            echo "✅ No server secrets leaked in client bundle"
          fi

  # ============================================================
  # JOB 3: Deploy (Production)
  # ============================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [secret-scan, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
