# ============================================================
# VendorTrack — Prometheus Configuration
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'vendortrack-production'
    environment: 'production'

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'vendortrack'
    metrics_path: '/api/performance'
    params:
      format: ['prometheus']
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'app:9002'
        labels:
          service: 'vendortrack-app'

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          service: 'redis'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'infrastructure'
