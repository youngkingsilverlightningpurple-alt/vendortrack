# ============================================================
# VendorTrack — Alertmanager Configuration
# ============================================================
# Routes alerts to the appropriate notification channels.
# ============================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://app:9002/api/alerts/webhook'
        # Send authorization header matching ALERTMANAGER_SECRET
        http_config:
          authorization:
            type: 'Bearer'
            credentials: '${ALERTMANAGER_SECRET}'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://app:9002/api/alerts/webhook'
        http_config:
          authorization:
            type: 'Bearer'
            credentials: '${ALERTMANAGER_SECRET}'
        send_resolved: true
    # Add Slack/PagerDuty integration here:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/...'
    #     channel: '#incidents-critical'

  - name: 'warning'
    webhook_configs:
      - url: 'http://app:9002/api/alerts/webhook'
        http_config:
          authorization:
            type: 'Bearer'
            credentials: '${ALERTMANAGER_SECRET}'
        send_resolved: true
